name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true

  secrets:
    name: Guard against committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a real .env file is committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::A .env file is tracked by git. Remove it and rotate every secret it contained."
            exit 1
          fi
          echo "No tracked .env file. Good."
